[package]
name = "forge-runtime-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "forge-runtime"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
forge-runtime-application.workspace = true
forge-runtime-domain.workspace = true
forge-runtime-infrastructure.workspace = true
futures-util.workspace = true
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["fs", "user"] }

[dev-dependencies]
futures-util.workspace = true
rusqlite.workspace = true
sha2.workspace = true
tempfile = "3"

[lints]
workspace = true
