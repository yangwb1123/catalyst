[workspace]
members = [
  "crates/application",
  "crates/domain",
  "crates/infrastructure",
  "crates/interfaces",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
cap-std = "4.0.2"
forge-runtime-application = { path = "crates/application" }
forge-runtime-domain = { path = "crates/domain" }
forge-runtime-infrastructure = { path = "crates/infrastructure" }
futures-core = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
too_many_lines = "deny"
