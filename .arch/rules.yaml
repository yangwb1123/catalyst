# ForgeOS architecture rules (machine-readable) — ENFORCED by harness/arch/arch-check.mjs.
#
# ForgeOS's own load-bearing wall, applied to ForgeOS. Until now the
# clean-architecture skill only DECLARED dependency direction; nothing checked
# it. This file makes the rules executable: arch-check.mjs reads it and FAILS the
# build on any violation (layering / package size / fan-in / cognitive load /
# anti-pattern naming). Two further checks — function-length and circular-
# dependency — are ALSO enforced by arch-check.mjs but read their limits
# (max_function_lines, circular_dependency_count) DIRECTLY from
# harness/policies.yml, so they are deliberately NOT mirrored here: a single
# source has nothing to drift from. (function-length fails closed if that limit
# is missing; circular_dependency_count is a fixed 0 — any cycle fails.)
#
# Every numeric limit below is set to ForgeOS's MEASURED actual + sensible
# headroom, so the repo PASSES honestly today and only trips on real drift.
# Measured 2026-06-19 (node harness/arch/arch-check.mjs prints the live numbers):
#   root:      4 source dirs, 2 root files
#   package:   max 11 code files/pkg (forge-core/cmd/forge); max EXPORTS/pkg = 25
#              (orchestrator), then 23 (mode's gate/depth vocabulary) — RECALIBRATED
#              2026-06-27: the prior "11" was undercounted by a countGoExports bug
#              that skipped grouped `const (...)` blocks (now fixed in scan.mjs), so
#              the export budget moved 20 → 30 to match the corrected real ceiling +
#              headroom. The scaffold/upgrade tooling lives in its own
#              harness/scaffold/ sub-package, so harness/ stays a thin gate package.
#              RECALIBRATED 2026-07-02: forge-core/cmd/forge's gates.go was pressed
#              against file.max_lines (500) by the RequirementConfidence + FileDelta
#              gap-fix (two more Signals wired end-to-end, mirroring the already-
#              landed ReviewStatus wiring) — "先拆分,再继续" split it into gates.go
#              (orchestration) + gate_resolve.go (the N/A exemption matrix + per-gate
#              resolution) + approve.go (the `forge approve list` CLI, previously
#              living at the tail of gates.go), raising the file count 14 → 16 and
#              (on review, wrongly) pushing max_files 14 → 18. gate_resolve.go was
#              actually pure business logic — gate-name -> tri-state verdict
#              resolution over the converge/gate types only, no CLI concerns — so it
#              moved OUT of cmd/forge into internal/gate/resolve.go instead (extending
#              the existing gate.Result/ProbeAll package, mirroring the
#              internal/attribution precedent), dropping the count back to 15 (14
#              original + approve.go, a genuinely new CLI surface with nowhere else
#              to go). max_files recalibrated 18 → 16 (actual 15 + headroom 1,
#              matching this metric's original 13-actual/14-budget convention) rather
#              than left at the wider 18.
#              RECALIBRATED again 2026-07-02: the secondary_template consumption gap-fix
#              split prompt_context.go's artifact-context lane (emitsContext/
#              usesTemplateContext/secondaryTemplateContext/appendArtifactContext) out
#              into prompt_artifacts.go — a genuine same-package file split (mirroring
#              prompt_memory.go's precedent), not new CLI surface — raising the count
#              15 → 16, which met but exhausted the prior budget's headroom. max_files
#              moved 16 → 17 (actual 16 + headroom 1, same convention as above) so the
#              next legitimate split has room rather than tripping immediately.
#   fanin:     max 7 PRODUCTION importing files (forge-core/internal/asset); tests excluded
#   cognitive: 4 top-level source modules (docs, examples, forge-core, harness)
#   functions: longest declared function <= 50 lines (policies.yml max_function_lines)
#   cycles:    0 circular module imports (policies.yml circular_dependency_count)
#
# DRIFT-GUARD: file.max_lines and root.max_files MUST equal harness/policies.yml.
# arch-check.mjs verifies this equality every run, so the two sources of truth
# cannot silently diverge. See `必须与 harness/policies.yml 一致` markers below.

# ── Repository root budget ────────────────────────────────────────────────
root:
  max_dirs: 10        # actual 4 source dirs + headroom
  max_files: 15       # 必须与 harness/policies.yml 一致 (max_root_files) — arch-check enforces equality

# ── Per-package / per-directory budget ────────────────────────────────────
package:
  max_files: 17       # actual 16 (forge-core/cmd/forge, incl. approve.go + prompt_artifacts.go split out of prompt_context.go 2026-07-02) + headroom
  max_exports: 30     # actual 27 (orchestrator, incl. parallel.go/waves.go) / 23 (mode) + headroom — recalibrated 2026-06-27

# ── Per-file budget ───────────────────────────────────────────────────────
file:
  max_lines: 500      # 必须与 harness/policies.yml 一致 (max_file_lines) — arch-check enforces equality

# ── Fan-in budget (how many PRODUCTION files import one target) ───────────
fanin:
  max_importers: 20   # actual 15 (forge-core/internal/asset, tests excluded) — RECALIBRATED 2026-06-27: asset is the foundational DATA-MODEL package (Workflow/Phase types), so a high fan-in is healthy, not a god-dependency smell (every orchestration file shares its vocabulary); the parallel orchestrator's waves.go/parallel.go legitimately import it. + headroom.

# ── Cognitive-load budget (top-level source modules to hold in your head) ──
cognitive:
  max_root_modules: 8 # actual 4 (docs, examples, forge-core, harness) + headroom

# ── Architecture: layered dependency direction (THE headline rule) ────────
# Clean Architecture: dependencies point INWARD. Outer layers may depend on
# inner ones; inner layers MUST NOT depend on outer ones.
#   interfaces (outermost) -> application -> domain (innermost)
#   infrastructure is an outer detail: it may be wired in by interfaces, but
#   domain/application must never import it.
architecture:
  # Layers ordered OUTER → INNER. Index = depth; a lower index is "more outer".
  layers:
    - interfaces
    - application
    - domain
    - infrastructure
  # Map concrete on-disk directory segment names onto canonical layers.
  # A file's layer = the layer of the FIRST path segment that matches an alias.
  dir_aliases:
    domain: domain
    application: application
    service: application
    interface: interfaces
    interfaces: interfaces
    httpapi: interfaces
    store: infrastructure
    infrastructure: infrastructure
  # Forbidden layer imports, as "from -> to". A non-test source file whose layer
  # is <from> must never import a file/package whose layer is <to>.
  # Encodes: inner layers never import outer layers.
  forbidden:
    # domain (innermost) must import NOTHING outer/sibling-detail:
    - "domain -> application"
    - "domain -> interfaces"
    - "domain -> infrastructure"
    # application must not import the outer interfaces layer:
    - "application -> interfaces"

# ── Naming: technical-role directory names that signal "organized by tech
# detail, not architecture" (cognitive-architecture skill, principle 1/2). A dir
# with one of these basenames is flagged UNLESS it is blessed as a real layer in
# architecture.dir_aliases (e.g. `service` -> application). A CHEAP PROXY: it
# catches obvious technical-layering grab-bags; it cannot prove a structure is
# good (that stays the architect's judgment + the 30-second tree litmus).
naming:
  anti_patterns:
    - utils
    - util
    - common
    - commons
    - misc
    - helpers
    - helper
    - manager
    - managers
    - handler
    - handlers
    - impl
