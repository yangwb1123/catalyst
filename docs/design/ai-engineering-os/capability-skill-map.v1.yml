api_version: forgeos.design/v1
kind: CapabilitySkillOwnershipMap
status: planning_only
executable: false
source_catalog: capability-catalog.v1.yml
skill_specification: skill-specifications.md
mapping_rules:
  - "Every unique fine capability referenced by lifecycle nodes has exactly one primary Skill package owner."
  - "A Skill may consume another package through an explicit dependency, but secondary use does not duplicate primary ownership."
  - "Kernel ABI and Device Fabric runtime capabilities are registered separately; this map covers lifecycle role capabilities only."
  - "Adapters and validators must reject missing, duplicate-primary, unknown-package, and dangling capability entries."

