architecture_summary: |
  sandbox.Runner contract (Run(ctx, argv, timeout) -> output/exit/err) with
  two wired implementations: FirecrackerRunner (mke2fs fresh ext4 per run,
  guest /init injection, marker read-back via debugfs, serial capture) and
  DockerRunner (docker run --rm --network none). Auto-wiring from
  SandboxConfig {Type, Image, Kernel}; fail-closed without a runner. CLI:
  --sandbox/--sandbox-image/--sandbox-kernel on run/evolve.
