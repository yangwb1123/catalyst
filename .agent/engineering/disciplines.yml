api_version: forgeos.agent-engineering/v1
kind: DisciplineRegistry
status: active_contract
runtime_binding: validation_only
owner: architecture

allowed_states: [enforced, partial, planned]

disciplines:
  - id: prompt
    purpose: Express bounded intent, constraints, expected output and stop conditions.
    state: partial
    assets: [.ai/prompts, .agent/AGENTS.md]
  - id: context
    purpose: Select the smallest relevant, fresh and provenance-bound working context.
    state: partial
    assets: [.agent/engineering/context-routes.yml, .agent/skills/context-engineering.md, skills/context-engineering, docs/contracts/context-package-v1.schema.json]
  - id: memory
    purpose: Preserve task, project and organizational knowledge without promoting inference to fact.
    state: planned
    assets: [.agent/workflows/evolve.yml, .agent/engineering/rules.yml]
  - id: tool
    purpose: Expose narrow typed actions with explicit effects, permissions and evidence.
    state: partial
    assets: [harness, .agent/skills, skills/project-snapshot, skills/context-engineering, skills/evidence-claim-management, skills/policy-authority, skills/adr-governance, skills/knowledge-graph-curation, skills/change-impact-cost-risk]
  - id: planning
    purpose: Decompose work into bounded, dependency-aware and acceptance-checkable increments.
    state: partial
    assets: [.agent/workflows/build.yml, .agent/skills/testing.md]
  - id: loop
    purpose: Iterate through execution, verification, repair and bounded convergence.
    state: partial
    assets: [.agent/workflows/build.yml, .agent/workflows/evolve.yml]
  - id: reflection
    purpose: Audit goals, assumptions, alternatives and unintended consequences using evidence.
    state: planned
    assets: [.agent/workflows/evolve.yml, .ai/prompts/08-post-sprint-review.md]
  - id: graph
    purpose: Represent task dependencies and provenance-bound partial system relations without hiding missing coverage.
    state: partial
    assets: [.agent/workflows, .agent/skills/cognitive-architecture.md, .agent/skills/knowledge-graph-curation.md, skills/knowledge-graph-curation/SKILL.md, docs/contracts/graph-snapshot-v1.schema.json]
  - id: harness
    purpose: Constrain tools, workspace, permissions and termination outside model reasoning.
    state: enforced
    assets: [harness, .agent/policies/modes.yml]
  - id: evaluation
    purpose: Measure outcomes with executable gates, regression suites and explicit N/A states.
    state: enforced
    assets: [.agent/eval, harness/acceptance.mjs]
  - id: knowledge
    purpose: Maintain sourced rules, ADRs and engineering knowledge with version and ownership.
    state: partial
    assets: [.agent/engineering/rules.yml, .agent/AGENTS.md, .agent/skills/adr-governance.md, docs/contracts/architecture-decision-record-v2.schema.json]
  - id: evolution
    purpose: Turn repeated, evidenced outcomes into governed improvement proposals.
    state: partial
    assets: [.agent/workflows/evolve.yml, .ai/prompts/08-post-sprint-review.md]
  - id: state
    purpose: Persist causal execution state, checkpoints and recovery without relying on model memory.
    state: planned
    assets: [.agent/workflows/build.yml]
  - id: contract
    purpose: Stabilize typed boundaries among agents, workflows, tools, artifacts and evidence.
    state: partial
    assets: [.agent/eval/completion-evidence.schema.yml, .agent/eval/acceptance.schema.yml, .agent/skills/capability-registry.md, .agent/skills/capability-ownership-projection.md, .agent/skills/project-snapshot.md, .agent/skills/context-engineering.md, .agent/skills/evidence-claim-management.md, .agent/skills/policy-authority.md, .agent/skills/adr-governance.md, .agent/skills/knowledge-graph-curation.md, .agent/skills/change-impact-cost-risk.md, skills/context-engineering/SKILL.md, skills/evidence-claim-management/SKILL.md, skills/policy-authority/SKILL.md, skills/adr-governance/SKILL.md, skills/knowledge-graph-curation/SKILL.md, skills/change-impact-cost-risk/SKILL.md, docs/contracts/architecture-decision-record-v2.schema.json, docs/contracts/capability-registry-v1.schema.json, docs/contracts/planning-capability-ownership-projection-v1.schema.json, docs/contracts/project-source-snapshot-v1.schema.json, docs/contracts/context-package-v1.schema.json, docs/contracts/capability-grant-v1.schema.json, docs/contracts/approval-record-v1.schema.json, docs/contracts/work-intent-v1.schema.json, harness/work_intent_contract_check.py, docs/contracts/authenticated-architecture-decision-approval-v1.schema.json, harness/authenticated_adr_approval_contract_check.py, docs/contracts/authenticated-architecture-decision-lifecycle-v1.schema.json, harness/authenticated_adr_lifecycle_contract_check.py, docs/adr/ADR-0084-authenticated-architecture-decision-lifecycle-authority-service-v1.md, docs/adr/ADR-0085-authenticated-architecture-decision-lifecycle-authority-evidence-and-source-distribution.md, docs/contracts/legacy-governance-read-import-v1.schema.json, docs/contracts/fixtures/legacy-governance-read-import-memory-v1.jsonl, docs/contracts/fixtures/legacy-governance-read-import-ADR-0001.md, docs/contracts/fixtures/legacy-governance-read-import-ADR-0002.md, docs/contracts/fixtures/legacy-governance-read-import-request-v1.json, docs/contracts/fixtures/legacy-governance-read-import-view-v