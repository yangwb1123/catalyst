  - { id: http-semantics, url: "https://datatracker.ietf.org/doc/html/rfc9110" }
  - { id: http-problem-details, url: "https://datatracker.ietf.org/doc/html/rfc9457" }
  - { id: postgresql-constraints, url: "https://www.postgresql.org/docs/current/ddl-constraints.html" }
  - { id: postgresql-isolation, url: "https://www.postgresql.org/docs/current/transaction-iso.html" }
  - { id: google-sre-cascading-failures, url: "https://sre.google/sre-book/addressing-cascading-failures/" }
  - { id: opentelemetry-semantic-conventions, url: "https://opentelemetry.io/docs/specs/semconv/" }
  - { id: owasp-api-security-2023, url: "https://owasp.org/API-Security/editions/2023/en/0x11-t10/" }
  - { id: kubernetes-pod-lifecycle, url: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/" }
