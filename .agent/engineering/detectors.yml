api_version: forgeos.agent-engineering/v1
kind: DetectorRegistry
status: active_contract
owner: governance

states: [enforced, shadow, planned, retired]
result_contract: acceptance-criterion/v1

detectors:
  - id: harness.governance
    version: 1.0.0
    state: enforced
    rule_refs: [GOV-001]
    implementation:
      argv: [python3, harness/check.py]
      cwd: repo_root
      shell: false
    invocation:
      owner: forge_accept
      adapter: acceptance.probeArch
      acceptance_criterion: arch_violations
      load_bearing: true
    fail_closed: true
    tests:
      positive: { path: harness/test_check.py, contains: test_real_repo_passes }
      negative: { path: harness/test_check.py, contains: test_detects_broken_workflow_ref }

  - id: harness.structure
    version: 1.0.0
    state: enforced
    rule_refs: [QUAL-001]
