non_capabilities:
  - no truth ledger authoritative current-knowledge view or semantic lifecycle projection
  - no conflict arbitration freshness interpretation or validity-window evaluation
  - no authenticated principal collector reviewer or authority
  - no confirmed fact accepted decision waiver or hard-gate satisfaction
  - no ContextPackage CapabilityGrant Approval or Transition runtime
  - no knowledge apply or legacy Memory and ADR promotion
  - no pre-code block completion verdict or production effect
  - CognitiveAtom v1 is a pure Claim projection with no truth authority instruction hard-guard transition completion or effect attestation
  - no prompt or model atom compiler full Kernel ABI atom persistence or journal adapter
  - Artifact provenance adapter does not read artifact content authenticate producer or collector attest truth authority claim atom completion persistence or effect
  - Command observation adapter does not execute commands verify output preimages authenticate producer or digest profiles attest pass completion truth authority claim atom persistence or effect
