  production_effects: forbidden

evidence_claim_portable_validation:
  record_api_version: forgeos.governance/v1
  delivery: shipped_pure_contract_and_closed_portable_skill
  mode: authority_free_exact_record_set_structural_validation
  semantic_authority: ADR-0045_only
  input:
    source: caller_supplied_exact_canonical_record_set_bytes
    explicit_eof_required: true
    min_records: 1
    max_records: 256
    max_input_bytes: 1048576
    overflow_detection_bytes: 1
    fixture_envelope_is_adapter_input: false
  result:
    success_exit: 0
    success_stdout_marker: STRUCTURALLY_VALID (shadow; no truth or authority attestation)
    success_stdout_framing: marker_plus_one_lf
    success_stderr: empty
    record_output: none
    rejection_exit: 1
    usage_exit: 2
  portable_package:
    source_distributed: true
    closed_manifest_required: true
    validator_argv: [python3, -I, -B, skills/evidence-claim-management/scripts/validate.py]
    validator_arguments: zero
    validator_input: exact_canonical_stdin_through_explicit_eof
    checker_argv: [python3, -I, -B, skills/evidence-claim-management/scripts/check_package.py]
    checker_package_root_argument: zero_or_one
    vendored_python_parity: exact_ADR_0045_reference_implementation
    fixture_envelope_is_adapter_input: false
    authors_defaults_repairs_sorts_inserts_digests_or_seals: false
    repository_environment_network_clock_provider_model_database_subprocess_reads: false
    journal_semantic_view_or_knowledge_update_proposal_access: false
    copies_catalyst_go_or_rust_runtime: false
    installs_host_skill: false
    python_isolation_boundary: excludes_script_current_directory_pythonpath_and_user_site_only
    system_site_stdlib_interpreter_startup_host_publisher: not_disabled_authenticated_or_isolated
    package_integrity_nofollow_unavailable_result: exit_1_fail_closed
    check_to_use_atomicity: not_provided
  attests: []
  persistence: none

policy_authority_portable_declaration_assessment:
  delivery: shipped_pure_contracts_and_closed_portable_skill
  mode: authority_neutral_caller_supplied_declaration_assessment_only
  semantic_authorities: [ADR-0056_only, ADR-0059_only]
  input:
    source: caller_supplied_exact_canonical_request_bytes
    explicit_eof_required: true
    max_input_bytes: 2097152
    overflow_detection_bytes: 1
    combined_dispatch_envelope: forbidden
  operations:
    capability_grant:
      request_api_version: forgeos.capability-grant-declared-assessment-request/v1
      assessment_api_version: forgeos.capability-grant-declared-assessment/v1
      adapter_argv: [python3, -I, -B, skills/policy-authority/scripts/assess_declared_capability_grant.py]
      result_marker: ASSESSED_DECLARATIONS_ONLY (no issuer authentication, policy decision, approval, revocation, usage, preflight, authorization, permission, persistence, execution, or effect attestation)
    approval_record:
      request_api_version: forgeos.approval-record-declared-assessment-request/v1
      assessment_api_version: forgeos.approval-record-declared-assessment/v1
      adapter_argv: [python3, -I, -B, skills/policy-authority/scripts/assess_declared_approval_record.py]
      result_marker: ASSESSED_APPROVAL_DECLARATIONS_ONLY (no approver or authority authentication, attestation or SoD proof verification, condition or RiskAcceptance validation, revocation evaluation, policy decision, effective approval, authorization, permission, persistence, transition, execution, or effect attestation)
  process:
    adapter_arguments: zero
    success_exit: 0
    success_stdout: exact_canonical_computed_assessment_plus_one_lf
    success_stderr: empty
    rejection_exit: 1
    usage_exit: 2
    pre_output_failure_stdout: empty
    output_failure_may_be_partial_or_indeterminate: true
    success_requires_exit_zero_and_exact_bytes: true
  portable_package:
    source_distributed: true
    closed_manifest_required: true
    checker_argv: [python3, -I, -B, skills/policy-authority/scripts/check_package.py]
    checker_package_root_argument: zero_or_one
    vendored_python_parity: exact_ADR_0056_and_ADR_0059_reference_implementations
    repository_environment_network_clock_identity_policy_approval_store_ledger_reads: false
    copies_catalyst_go_or_rust_runtime: false
    installs_host_skill: false
    python_isolation_boundary: excludes_script_current_directory_pythonpath_and_user_site_only
    system_site_stdlib_interpreter_startup_host_publisher: not_disabled_authenticated_or_isolated
    package_integrity_nofollow_unavailable_result: exit_1_fail_closed
    check_to_use_atomicity: not_provided
  authority:
    policy_decision: none
    authorization_decision: none
    unavailable_states: not_evaluated
    assessment_defined_attestation_fields: false
    execution: unavailable_and_unattested
  attests: []
  persistence: none

