api_version: forgeos.agent-engineering/v1
kind: GovernanceContractRegistry
status: active_contract
runtime_binding: cross_language_codec_local_journal_atom_projection_artifact_command_adapters_shadow
owner: governance
version: 6
completion_authority: forge_accept

scope:
  shipped_kinds: [EvidenceRecord, KnowledgeClaim]
  shipped_projections: [CognitiveAtom]
  shipped_adapters: [artifact_provenance_to_evidence, command_observation_to_evidence]
  planned_kinds: [ContextPackage, CapabilityGrant, ApprovalRecord, TransitionReceipt, KnowledgeUpdateProposal]
  persistence: local_append_only_exact_evidence_claim_journal
  authority_attestation: unavailable
  trusted_instruction_lane: unavailable
  production_effects: forbidden

cognitive_atom_projection:
  api_version: forgeos.aadm.cognitive-atom/v1
  mode: deterministic_claim_to_atom_shadow
  source_kinds: [KnowledgeClaim]
  projectable_claim_types: [assumption, constraint, decision, fact, hypothesis, inference, unknown]
  ignored_claim_types: [lesson, proposal]
  constants:
    authority_ref: null
    hardness: none
    instruction_allowed: false
    projection_mode: shadow
  source_record_set:
    exact_canonical_required: true
    closed_world_required: true
    max_records: 256
    max_bytes: 1048576
  closure_edges: [contradicting_evidence, derived_from_claim, supporting_evidence, supersedes]
  identity:
    atom_id_domain: "forgeos.aadm.cognitive-atom-id.v1\0"
    atom_digest_domain: "forgeos.aadm.cognitive-atom.v1\0"
    atom_set_digest_domain: "forgeos.aadm.cognitive-atom-set.v1\0"
    source_closure_digest_domain: "forgeos.governance.record-set.v1\0"
    length_framing: unsigned_u64_big_endian
  limits:
    max_atom_bytes: 131072
    max_atom_set_bytes: 1048576
    max_atoms: 256
  positive_result: PROJECTED_SHADOW
  attests: []
  persistence: none

artifact_evidence_adapter:
  api_version: forgeos.governance.artifact-evidence-adapter/v1
  mode: deterministic_artifact_provenance_to_evidence_shadow
  source_kind: forgeos.artifact.v1
  output_kind: EvidenceRecord
  source_fields: [_format, agent, created_at, model, path, phase, prompt_sha256, run_id, sha256, size, workflow]
  binding_fields: [aggregate_id, context_sha256, policy_sha256, project_id, scope, sensitivity, sequence, source_revision, source_tree_sha256, subjects, supersedes_record_ids]
  exact_request:
    canonical_required: true
    compact_utf8_required: true
    artifact_key_exception: request.artifact._format
    legacy_empty_format: reject
    reads_current_artifact: false
  identity:
    source_digest_domain: "forgeos.governance.artifact-provenance-source.v1\0"
    request_digest_domain: "forgeos.governance.artifact-evidence-adapter.request.v1\0"
    evidence_record_digest_domain: "forgeos.governance.evidence-record.v1\0"
    record_id_prefix: artifact-evidence-
    snapshot_id_prefix: artifact-snapshot-
    timestamp_projection: floor_nonnegative_instant_to_unix_milliseconds
  constants:
    principal_id: forgeos.artifact-evidence-adapter
    principal_type: tool
    authority_domain: shadow
    role: evidence-adapter
    collector_version: v1
    evidence_type: artifact
    directness: direct
    source_trust: observed
    content_role: untrusted_data
    status: valid
  limits:
    max_request_bytes: 131072
    max_depth: 16
    max_object_fields: 64
    max_array_items: 256
    max_string_bytes: 16384
    integer_domain: signed_int64
  positive_result: ADAPTED_SHADOW (no truth, authority, claim, atom, persistence, or effect attestation)
  attests: []
  persistence: none

command_observation_evidence_adapter:
  api_version: forgeos.governance.command-observation-evidence-adapter/v1
  mode: deterministic_command_observation_to_evidence_shadow
  source_kind: forgeos.command-observation/v1
  output_kind: EvidenceRecord
  source_fields: [api_version, canonicalization, command, ended_at_unix_ms, evidence_type, producer, source, started_at_unix_ms, streams, termination]
  binding_fields: [aggregate_id, context_sha256, policy_sha256, project_id, scope, sensitivity, sequence, subjects, supersedes_record_ids]
  exact_request:
    canonical_required: true
    compact_utf8_required: true
    observation_anchor: "#CommandObservationV1"
    observation_terminations: [cancelled, exited, timed_out]
    projectable_termination: exited
    executes_command: false
    reads_current_process: false
    digest_preimage_profile: not_frozen_opaque_producer_declaration
  identity:
    command_digest_domain: "forgeos.governance.command-observation.command.v1\0"
    source_digest_domain: "forgeos.governance.command-observation-source.v1\0"
    request_digest_domain: "forgeos.governance.command-observation-evidence-adapter.request.v1\0"
    evidence_record_digest_domain: "forgeos.governance.evidence-record.v1\0"
    record_id_prefix: command-evidence-
    snapshot_id_prefix: command-observation-
    principal_run_id_prefix: command-adaptation-
  constants:
    principal_id: forgeos.command-observation-evidence-adapter
    principal_type: tool
    authority_domain: shadow
    role: evidence-adapter
    collector_from: producer_declaration
    collector_parameters: command_sha256
    artifact_sha256: source_snapshot_sha256
    evidence_types: [gate_result, test_run]
    directness: direct
    source_trust: observed
    content_role: untrusted_data
    source_snapshot_type: runtime
    status: valid
  limits:
    max_request_bytes: 131072
    max_depth: 16
    max_object_fields: 64
    max_array_items: 256
    max_argv_items: 64
    max_text_scalars: 4096
    max_string_bytes: 16384
    max_timeout_ms: 86400000
    integer_domain: signed_int64
    exit_code_domain: portable_nonnegative_signed_int32
  positive_result: ADAPTED_SHADOW (observation mapping only; no execution, pass, completion, truth, authority, claim, atom, persistence, or effect attestation)
  attests: []
  persistence: none

canonicalization:
  format: forgeos.canonical-json/v1
  object_keys: ascii_snake_case_sorted
  input_form: exact_compact_utf8
  unicode: preserve_exact_scalars_without_normalization
  forbidden_unicode: [ascii_control, bidi_control, line_separator, paragraph_separator]
  integers: signed_64_bit_only
  floats: forbidden
  max_record_bytes: 131072
  max_record_set_bytes: 1048576
  max_depth: 16
  max_object_fields: 64
  max_array_items: 256
  max_string_bytes: 16384
  digest_encoding: lowercase_hex_without_prefix
  self_digest_rule: canonicalize_with_integrity_canonical_sha256_empty
  digest_domains:
    EvidenceRecord: "forgeos.governance.evidence-record.v1\0"
    KnowledgeClaim: "forgeos.governance.knowledge-claim.v1\0"

identity:
  record_id: immutable_record_identity
  aggregate_id: stable_logical_identity
  sequence: positive_monotonic_version
  supersedes: exact_prior_record_ids_same_aggregate
  canonical_sha256: content_identity_not_record_identity
  idempotency_key: caller_supplied_batch_replay_key

claim_states:
  fact: [candidate, confirmed, contested, stale, retracted, superseded]
  constraint: [candidate, active, waived, expired, superseded]
  decision: [proposed, accepted, rejected, deprecated, superseded]
  inference: [candidate, supported, contested, invalidated, expired]
  assumption: [open, testing, validated, invalidated, expired]
  hypothesis: [open, testing, validated, invalidated, expired]
  lesson: [candidate, observed, repeated, retired, promoted]
  proposal: [draft, submitted, adopted, rejected, superseded]
  unknown: [open, investigating, resolved, accepted_risk]

shadow_admissibility:
  fact: [candidate, contested]
  constraint: [candidate]
  decision: [proposed]
  inference: [candidate]
  assumption: [open, testing]
  hypothesis: [open, testing]
  lesson: [candidate]
  proposal: [draft, submitted]
  unknown: [open, investigating]
  authoritative_state_result: reject_authority_unavailable
  confirmed_fact_result: reject_even_with_declared_direct_evidence
  hard_gate_eligible_claim_types: []

evidence_semantics:
  types: [repo_locator, test_run, gate_result, runtime_metric, external_source, human_attestation, artifact]
  states: [valid, invalid, unavailable, expired]
  directness: [direct, derived, attested]
  sensitivities: [public, internal, confidential, restricted]
  source_trust: [untrusted, observed, controlled, authoritative]
  shadow_allowed_source_trust: [untrusted, observed]
  content_roles: [untrusted_data, trusted_control]
  shadow_allowed_content_roles: [untrusted_data]
  locator_by_type:
    repo_locator: repo
    test_run: command
    gate_result: command
    runtime_metric: metric
    external_source: external
    human_attestation: attestation
    artifact: artifact

journal:
  api_version: forgeos.governance-journal/v1
  record_kinds: [EvidenceRecord, KnowledgeClaim]
  append_semantics: atomic_bounded_exact_record_set
  limits:
    max_records: 256
    max_record_set_bytes: 1048576
    max_idempotency_key_bytes: 256
    max_dependency_records: 1024
    max_dependency_bytes: 16777216
    max_derivation_depth: 256
    reference_closure_classification: resource_exhaustion_admissibility
  idempotency:
    first_disposition: stored
    exact_replay_disposition: exact_replay
    changed_request_result: conflict
    different_key_same_records_result: conflict
    replay_preserves_original_append_time: true
  digests:
    record_set_domain: "forgeos.governance.record-set.v1\0"
    append_request_domain: "forgeos.governance.record-journal.append-request.v1\0"
    request_framing: u64be_key_length_then_key_then_u64be_record_set_length_then_record_set
    batch_id: governance-record-batch-prefix_plus_request_sha256
  inspection:
    default: metadata_only
    exact_record_reveal: explicit_only
  structural_head:
    key: [record_kind, aggregate_id]
    interpretation: structural_sequence_only
    rebuildable_from_exact_records: true
    truth: false
    authority: false
    freshness: false
    conflict_resolution: false
    hard_gate_eligible: false
  storage:
    schema: sqlite_hub_v25_additive_empty
    legacy_backfill: forbidden
    read_migration: forbidden
  runtime_delivery:
    command: forge-runtime
    compatible_api: forgeos.governance-journal/v1
    compatible_binary_required: true
    scaffold_inherits: [contract, skill, shadow_checker]
    scaffold_installs_rust_binary: false
    unavailable_result: not_executed
    persistence_claim_requires_receipt: true

legacy:
  rejected_kind_aliases: [Evidence, Claim, ContextManifest, AuthorityGrant, AgentCapabilityGrant]
  memory_import: not_implemented
  adr_import: not_implemented
  missing_confidence_default: forbidden
  legacy_status_is_authority: false

canonical_refs:
  schema: docs/contracts/governance-evidence-claim-v1.schema.json
  journal_schema: docs/contracts/governance-record-journal-v1.schema.json
  golden_fixture: docs/contracts/fixtures/governance-evidence-claim-v1.json
  skill: .agent/skills/evidence-claim-management.md
  checker: harness/governance_contract_check.py
  cognitive_atom_schema: docs/contracts/cognitive-atom-projection-v1.schema.json
  cognitive_atom_golden_fixture: docs/contracts/fixtures/cognitive-atom-projection-v1.json
  cognitive_atom_checker: harness/cognitive_atom_contract_check.py
  artifact_evidence_adapter_schema: docs/contracts/artifact-evidence-adapter-v1.schema.json
  artifact_evidence_adapter_golden_fixture: docs/contracts/fixtures/artifact-evidence-adapter-v1.json
  artifact_evidence_adapter_checker: harness/artifact_evidence_adapter_check.py
  command_observation_evidence_adapter_schema: docs/contracts/command-observation-evidence-adapter-v1.schema.json
  command_observation_evidence_adapter_golden_fixture: docs/contracts/fixtures/command-observation-evidence-adapter-v1.json
  command_observation_evidence_adapter_checker: harness/command_observation_evidence_adapter_check.py
  decision: docs/adr/0045-canonical-evidence-claim-contract.md
  journal_decision: docs/adr/0046-local-governance-record-journal.md
  cognitive_atom_decision: docs/adr/0047-shadow-cognitive-atom-projection-v1.md
  artifact_evidence_adapter_decision: docs/adr/0048-artifact-provenance-evidence-adapter-v1.md
  command_observation_evidence_adapter_decision: docs/adr/0049-command-observation-evidence-adapter-v1.md
  standard: docs/design/ai-engineering-os/governance-contracts.md

