scope:
  shipped_kinds: [EvidenceRecord, KnowledgeClaim, ContextPackage]
  shipped_contract_only_kinds: [ApprovalRecord, CapabilityGrant, KnowledgeUpdateProposal, TransitionReceipt]
  shipped_runtime_profiles: [authenticated_bootstrap_repo_read_grant_issuance_v1, authenticated_bootstrap_repo_read_execution_v1]
