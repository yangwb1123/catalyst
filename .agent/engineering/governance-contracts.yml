    projection: catalyst_repository_only
  cognitive_atom_python:
    ref: harness/cognitive_atom_contract_check.py
    projection: universal_scaffold
  cognitive_atom_go:
    ref: forge-core/internal/cognitiveatomcontract
    projection: catalyst_repository_only
  cognitive_atom_rust:
    ref: forge-runtime/crates/domain/src/cognitive_atom_contract
    projection: catalyst_repository_only
