# ForgeOS harness policies (v0) — host-independent source of truth.
# Run: node harness/gate.mjs
max_file_lines: 500
max_function_lines: 50         # ENFORCED by harness/arch/arch-check.mjs (function-length check; zero-dep heuristic parser, Go/JS/Py)
max_root_files: 15
circular_dependency_count: 0   # ENFORCED by harness/arch/arch-check.mjs (circular-dependency check; DFS over the internal import graph)
coverage_min: 80               # 参考默认值,非 load-bearing;真正执法的行覆盖下限 = modes.yml coverage_threshold + coverage_delta(经 acceptance-quality.mjs resolveCoverageThreshold 解析),无覆盖工具时 N/A
enforce: block                 # warn | block — now ENFORCING (v0 止血完成;CC hook 未装,仅影响手动/CI gate)
